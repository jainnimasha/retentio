<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">User Groups and Events visual</title>
<desc id="desc">Regional and industry-led customer groups connect customers, create peer relationships and surface advocacy opportunities.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#F3F9FF"/><stop offset="1" stop-color="#EAF5FF"/>
 </linearGradient>
 <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#DCEEFF"/><stop offset="1" stop-color="#CFE5FA"/>
 </linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
   <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#5279A9" flood-opacity=".16"/>
 </filter>
 <filter id="pinshadow" x="-50%" y="-50%" width="200%" height="200%">
   <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#4975B5" flood-opacity=".22"/>
 </filter>
 <clipPath id="av1"><circle cx="575" cy="238" r="25"/></clipPath>
 <clipPath id="av2"><circle cx="830" cy="210" r="25"/></clipPath>
 <clipPath id="av3"><circle cx="700" cy="370" r="25"/></clipPath>
</defs>

<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<circle cx="650" cy="340" r="260" fill="#E5F2FF" opacity=".58"/>

<!-- soft world map -->
<g opacity=".72" fill="url(#map)">
 <path d="M475 205l-38 15-32 34 12 27 41 8 22 30 37-7 19-34-12-27 23-28-18-24z"/>
 <path d="M515 325l28 9 16 39-8 47-24 44-20-10-8-43-20-31 7-35z"/>
 <path d="M650 190l45-17 48 11 37 29 49 8 38 31-18 28-50-5-25 28-46-4-25-24-43 5-19-29 25-24z"/>
 <path d="M720 305l47-6 39 19 13 34-25 30-18 49-28 22-28-30 10-42-25-30z"/>
 <path d="M840 455l29-5 27 22-8 31-36 3-20-20z"/>
</g>

<!-- city/event connections -->
<g fill="none" stroke="#72A7EA" stroke-width="2.5" stroke-dasharray="5 9" stroke-linecap="round">
 <path d="M575 238 C650 215 740 215 830 210"/>
 <path d="M575 238 C600 285 650 335 700 370"/>
 <path d="M830 210 C790 275 755 330 700 370"/>
</g>
<g fill="#4A8AF0">
 <circle cx="650" cy="218" r="6"/><circle cx="758" cy="214" r="6"/><circle cx="640" cy="314" r="6"/>
</g>

<!-- avatar hubs -->
<g filter="url(#pinshadow)">
 <circle cx="575" cy="238" r="31" fill="white" stroke="#5A8FF1" stroke-width="4"/>
 <image href="data:image/png;base64," x="550" y="213" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#av1)"/>
 <circle cx="830" cy="210" r="31" fill="white" stroke="#59BFAF" stroke-width="4"/>
 <image href="data:image/png;base64," x="805" y="185" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#av2)"/>
 <circle cx="700" cy="370" r="31" fill="white" stroke="#8A72EE" stroke-width="4"/>
 <image href="data:image/png;base64," x="675" y="345" width="50" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#av3)"/>
</g>

<!-- location pins -->
<g filter="url(#pinshadow)">
 <path d="M575 271c-19-23-28-35-28-49a28 28 0 1 1 56 0c0 14-9 26-28 49z" fill="#3E80F2"/>
 <circle cx="575" cy="222" r="8" fill="white"/>
 <path d="M830 243c-19-23-28-35-28-49a28 28 0 1 1 56 0c0 14-9 26-28 49z" fill="#16A88D"/>
 <circle cx="830" cy="194" r="8" fill="white"/>
 <path d="M700 403c-19-23-28-35-28-49a28 28 0 1 1 56 0c0 14-9 26-28 49z" fill="#7559E9"/>
 <circle cx="700" cy="354" r="8" fill="white"/>
</g>

<!-- group cards -->
<g filter="url(#shadow)" font-family="Arial,sans-serif">
 <rect x="405" y="78" width="235" height="70" rx="17" fill="white"/>
 <circle cx="438" cy="113" r="18" fill="#EAF1FF"/>
 <path d="M429 111a6 6 0 1 1 12 0M425 127c2-9 18-9 22 0M444 110a5 5 0 1 1 10 0M451 126c1-6 12-6 15 0" fill="none" stroke="#3E80F2" stroke-width="2.3" stroke-linecap="round"/>
 <text x="470" y="109" font-size="14" font-weight="700" fill="#11153D">New York</text>
 <text x="470" y="130" font-size="12" fill="#62749A">18 members</text>

 <rect x="790" y="78" width="235" height="70" rx="17" fill="white"/>
 <circle cx="823" cy="113" r="18" fill="#E7FAF6"/>
 <path d="M814 111a6 6 0 1 1 12 0M810 127c2-9 18-9 22 0M829 110a5 5 0 1 1 10 0M836 126c1-6 12-6 15 0" fill="none" stroke="#16A88D" stroke-width="2.3" stroke-linecap="round"/>
 <text x="855" y="109" font-size="14" font-weight="700" fill="#11153D">London</text>
 <text x="855" y="130" font-size="12" fill="#62749A">12 members</text>

 <rect x="755" y="470" width="235" height="70" rx="17" fill="white"/>
 <circle cx="788" cy="505" r="18" fill="#EEEAFE"/>
 <path d="M779 503a6 6 0 1 1 12 0M775 519c2-9 18-9 22 0M794 502a5 5 0 1 1 10 0M801 518c1-6 12-6 15 0" fill="none" stroke="#7559E9" stroke-width="2.3" stroke-linecap="round"/>
 <text x="820" y="501" font-size="14" font-weight="700" fill="#11153D">Singapore</text>
 <text x="820" y="522" font-size="12" fill="#62749A">9 members</text>
</g>

<!-- central peer connection signal -->
<g filter="url(#shadow)">
 <rect x="470" y="470" width="210" height="64" rx="18" fill="white"/>
 <circle cx="502" cy="502" r="18" fill="#EAF2FF"/>
 <path d="M494 498a6 6 0 1 1 12 0M490 514c2-9 18-9 22 0" fill="none" stroke="#3E80F2" stroke-width="2.5" stroke-linecap="round"/>
 <text x="532" y="499" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#11153D">Peer connection</text>
 <text x="532" y="519" font-family="Arial,sans-serif" font-size="11" fill="#62749A">Shared interests • shared experience</text>
</g>

<!-- small event markers -->
<g>
 <circle cx="455" cy="310" r="9" fill="#5C8FF0"/><circle cx="880" cy="330" r="9" fill="#59BFAF"/>
 <circle cx="770" cy="410" r="8" fill="#8A72EE"/>
</g>
</svg>