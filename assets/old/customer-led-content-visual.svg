<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Customer-led content visual</title>
<desc id="desc">A customer voice is transformed into blog, social, white paper, webinar and playbook content.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F2FFFD"/><stop offset="1" stop-color="#EAF9F6"/>
 </linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2476F2"/><stop offset="1" stop-color="#6A4CF3"/>
 </linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#4D8B83" flood-opacity=".16"/>
 </filter>
 <filter id="smallshadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#6E83B4" flood-opacity=".16"/>
 </filter>
 <clipPath id="portraitClip"><circle cx="292" cy="235" r="52"/></clipPath>
</defs>

<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<circle cx="610" cy="325" r="250" fill="#E2F8F4" opacity=".55"/>

<!-- customer interview / voice card -->
<g filter="url(#shadow)">
 <rect x="92" y="118" width="395" height="410" rx="26" fill="white"/>
 <circle cx="292" cy="235" r="60" fill="#F1F4FF"/>
 <circle cx="292" cy="235" r="55" fill="white" stroke="#62C8BF" stroke-width="6"/>
 <image href="data:image/png;base64," x="240" y="183" width="104" height="104" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
 <text x="292" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#11153D">Customer voice</text>
 <text x="292" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5B709B">Experience • expertise • perspective</text>

 <!-- quotation -->
 <text x="140" y="404" font-family="Georgia,serif" font-size="54" fill="#69C9C0">“</text>
 <text x="175" y="414" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#26375F">“We’ve seen real impact</text>
 <text x="175" y="437" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#26375F">since implementing this.”</text>
 <rect x="175" y="461" width="190" height="7" rx="3.5" fill="#DCE5EE"/>
 <rect x="175" y="479" width="125" height="7" rx="3.5" fill="#E8EEF4"/>
</g>

<!-- transformation arrow / flow -->
<g fill="none" stroke="#65BEB8" stroke-width="3" stroke-dasharray="5 9" stroke-linecap="round">
 <path d="M490 323 C555 323 575 250 635 250"/>
 <path d="M490 323 C555 323 575 330 635 330"/>
 <path d="M490 323 C555 323 575 410 635 410"/>
</g>
<circle cx="555" cy="323" r="9" fill="#65BEB8"/>
<circle cx="605" cy="280" r="6" fill="#8B76F1"/>
<circle cx="605" cy="366" r="6" fill="#8B76F1"/>

<!-- output content cards -->
<g filter="url(#smallshadow)">
 <!-- blog -->
 <rect x="655" y="85" width="410" height="78" rx="17" fill="white"/>
 <circle cx="694" cy="124" r="20" fill="#E9F1FF"/>
 <rect x="686" y="112" width="16" height="22" rx="2" fill="none" stroke="#2476F2" stroke-width="2.5"/>
 <path d="M690 118h9M690 124h9" stroke="#2476F2" stroke-width="2" stroke-linecap="round"/>
 <text x="732" y="130" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#11153D">Blog</text>

 <!-- social -->
 <rect x="655" y="181" width="410" height="78" rx="17" fill="white"/>
 <circle cx="694" cy="220" r="20" fill="#EEF0FF"/>
 <text x="694" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#3656C8">in</text>
 <text x="732" y="226" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#11153D">LinkedIn / Social</text>

 <!-- white paper -->
 <rect x="655" y="277" width="410" height="78" rx="17" fill="white"/>
 <circle cx="694" cy="316" r="20" fill="#EEE9FF"/>
 <rect x="686" y="304" width="16" height="22" rx="2" fill="none" stroke="#6A4CF3" stroke-width="2.5"/>
 <path d="M690 310h9M690 316h9M690 322h6" stroke="#6A4CF3" stroke-width="2" stroke-linecap="round"/>
 <text x="732" y="322" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#11153D">White paper</text>

 <!-- webinar -->
 <rect x="655" y="373" width="410" height="78" rx="17" fill="white"/>
 <circle cx="694" cy="412" r="20" fill="#F1EBFF"/>
 <rect x="684" y="402" width="20" height="17" rx="4" fill="none" stroke="#7958EE" stroke-width="2.5"/>
 <path d="M691 406l7 4-7 4z" fill="#7958EE"/>
 <text x="732" y="418" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#11153D">Webinar</text>

 <!-- playbook -->
 <rect x="655" y="469" width="410" height="78" rx="17" fill="white"/>
 <circle cx="694" cy="508" r="20" fill="#E6FAF6"/>
 <path d="M684 495h9c5 0 8 3 8 8v17c-4-3-8-4-13-2v-23zM701 495h9v23c-4-2-8-1-13 2v-17c0-5 2-8 4-8z" fill="none" stroke="#16A68E" stroke-width="2.5"/>
 <text x="732" y="514" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#11153D">Playbook</text>
</g>

<!-- small central label -->
<g filter="url(#smallshadow)">
 <rect x="505" y="284" width="105" height="78" rx="18" fill="white"/>
 <text x="557" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6B62D8">CUSTOMER</text>
 <text x="557" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#11153D">voice → proof</text>
</g>

</svg>